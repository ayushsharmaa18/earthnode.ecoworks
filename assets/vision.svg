<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="400" fill="url(#sky)" />
  <rect y="400" width="100%" height="400" fill="url(#ground)" />
  <!-- Simple tree icons -->
  <g fill="#10b981">
    <circle cx="200" cy="500" r="40"/>
    <rect x="190" y="500" width="20" height="80"/>
    <circle cx="400" cy="450" r="50"/>
    <rect x="390" y="450" width="20" height="100"/>
    <circle cx="800" cy="550" r="60"/>
    <rect x="790" y="550" width="20" height="120"/>
    <circle cx="1000" cy="480" r="45"/>
    <rect x="990" y="480" width="20" height="90"/>
  </g>
  <!-- People silhouettes -->
  <g fill="#042b1d">
    <path d="M300,650 q0,-50 50,-50 t50,50 q0,50 -50,50 t-50,-50"/>
    <path d="M500,650 q0,-50 50,-50 t50,50 q0,50 -50,50 t-50,-50"/>
    <path d="M700,650 q0,-50 50,-50 t50,50 q0,50 -50,50 t-50,-50"/>
    <path d="M900,650 q0,-50 50,-50 t50,50 q0,50 -50,50 t-50,-50"/>
  </g>
</svg>