<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#042b1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5a3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <!-- Abstract landscape -->
  <g fill-opacity="0.2">
    <path d="M0,400 Q300,200 600,400 T1200,400 L1200,630 L0,630 Z" fill="url(#accentGrad)"/>
  </g>
  <!-- Text would normally be here, but for simplicity we'll leave as abstract -->
  <g fill="#ffffff" font-family="Space Grotesk, sans-serif" text-anchor="middle">
    <text x="600" y="300" font-size="48" font-weight="800">Earthnode</text>
    <text x="600" y="360" font-size="24" font-weight="600">Ecoworks</text>
    <text x="600" y="420" font-size="18" font-weight="400" opacity="0.8">Connect • Collaborate • Create Impact</text>
  </g>
</svg>